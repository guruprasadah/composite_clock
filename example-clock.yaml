# Example ESPHome configuration for the composite_clock custom component.
#
# Wire up an ESP32 to a composite-video display (e.g. an old TV with a yellow
# RCA jack):
#   - GND  -> RCA outer barrel
#   - A1   -> RCA centre pin   (DAC1 on the Adafruit HUZZAH32)
#
# Then flash this config and the current time will be drawn in big digits in
# the centre of the screen, in 24-hour format, with the colour and brightness
# configured below.

esphome:
  name: composite-clock
  friendly_name: Composite Clock

esp32:
  board: esp32dev
  framework:
    type: arduino

# Composite video needs WiFi time sync, so bring up WiFi.
wifi:
  ssid: "VandhaEdam"
  password: "SketchAah?"

# SNTP gives us the time that composite_clock reads.
time:
  - platform: sntp
    id: sntp_time
    timezone: UTC0
    # Update once a minute is plenty; the display redraws every second on its own.
    update_interval: 60s

# The custom component. Put the esphome/components/composite_clock folder next
# to this YAML (or use the `custom_components_path` / external_components
# mechanism) so ESPHome can find it.
external_components:
  - source:
      type: local
      path: ./components

composite_clock:
  id: my_clock
  time_id: sntp_time
  mode: NTSC          # NTSC or PAL
  hue: 4              # 0-15 (0 = white, 4 = green-ish, 12 = blue-ish, ...)
  brightness: 54      # 0-54 (0 = invisible, 54 = full intensity)
  show_seconds: false
  blink_colon: true

# Optional: expose the colour/brightness as Home Assistant numbers so you can
# change them on the fly. See the README for the lambda examples.
number:
  - platform: template
    name: "Clock Hue"
    id: clock_hue
    optimistic: true
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 4
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(my_clock).set_hue((uint8_t) x);

  - platform: template
    name: "Clock Brightness"
    id: clock_brightness
    optimistic: true
    min_value: 0
    max_value: 54
    step: 1
    initial_value: 54
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(my_clock).set_brightness((uint8_t) x);
